<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Задания на работу с DOM</title>
        <link rel="stylesheet" href="./style.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&subset=cyrillic&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="workspace">
            <div class="workspace__form">
                <form class="form" onsubmit="return renderCard(this)">
                    <div class="form__header">
                        <div class="form__title">Конструктор визиток</div>
                    </div>
                    <div class="form__field">
                        <label class="form__label">Наименование организации</label>
                        <input type="text" class="form__control" name="organization" value="ООО &quot;Ориентир&quot;">
                    </div>
                    <div class="form__field">
                        <label class="form__label">Фамилия, имя, отчество</label>
                        <input type="text" class="form__control" name="fio" value="Фёдоров Иван Семенович">
                        <div class="switcher">
                            <label class="switcher__item">
                                <input type="radio" name="fio-align" value="left">
                                <span class="switcher__label"><span class="icon icon--left"></span></span>
                            </label>
                            <label class="switcher__item">
                                <input type="radio" name="fio-align" value="center" checked>
                                <span class="switcher__label"><span class="icon icon--center"></span></span>
                            </label>
                            <label class="switcher__item">
                                <input type="radio" name="fio-align" value="right">
                                <span class="switcher__label"><span class="icon icon--right"></span></span>
                            </label>
                        </div>
                        <div class="switcher">
                            <label class="switcher__item">
                                <input type="radio" name="fio-font-size" value="24px">
                                <span class="switcher__label">24px</span>
                            </label>
                            <label class="switcher__item">
                                <input type="radio" name="fio-font-size" value="26px" checked>
                                <span class="switcher__label">26px</span>
                            </label>
                            <label class="switcher__item">
                                <input type="radio" name="fio-font-size" value="28px">
                                <span class="switcher__label">28px</span>
                            </label>
                        </div>
                    </div>
                    <div class="form__field">
                        <label class="form__label">Должность</label>
                        <input type="text" class="form__control" name="position" value="Менеджер по развитию">
                        <div class="switcher">
                            <label class="switcher__item">
                                <input type="radio" name="position-align" value="left">
                                <span class="switcher__label"><span class="icon icon--left"></span></span>
                            </label>
                            <label class="switcher__item">
                                <input type="radio" name="position-align" value="center" checked>
                                <span class="switcher__label"><span class="icon icon--center"></span></span>
                            </label>
                            <label class="switcher__item">
                                <input type="radio" name="position-align" value="right">
                                <span class="switcher__label"><span class="icon icon--right"></span></span>
                            </label>
                        </div>
                        <div class="switcher">
                            <label class="switcher__item">
                                <input type="radio" name="position-font-size" value="14px">
                                <span class="switcher__label">14px</span>
                            </label>
                            <label class="switcher__item">
                                <input type="radio" name="position-font-size" value="16px" checked>
                                <span class="switcher__label">16px</span>
                            </label>
                            <label class="switcher__item">
                                <input type="radio" name="position-font-size" value="18px">
                                <span class="switcher__label">18px</span>
                            </label>
                        </div>
                    </div>
                    <div class="form__field">
                        <label class="form__label">Телефон</label>
                        <input type="text" class="form__control" name="contact--phone" value="8 (999) 123-45-67">
                        <button type="button" class="form__add" onclick="this.hidden = true; this.nextElementSibling.hidden = false">Добавить еще один телефон</button>
                        <div class="form__row" hidden>
                            <input type="text" class="form__control" name="contact--phone2">
                            <button type="button" class="btn-icon" onclick="this.parentNode.hidden = true; this.parentNode.previousElementSibling.hidden = false; this.previousElementSibling.value = ''">−</button>
                        </div>
                    </div>
                    <div class="form__field">
                        <label class="form__label">E-mail</label>
                        <input type="text" class="form__control" name="contact--email" value="fedorov.is@orientir.org">
                        <label class="form__check">
                            <input type="checkbox" name="contact--email-visible" checked> Отображать
                        </label>
                    </div>
                    <div class="form__field">
                        <label class="form__label">Адрес</label>
                        <input type="text" class="form__control" name="contact--address" value="Иркутск, Байкальская, 421, оф. 12">
                        <label class="form__check">
                            <input type="checkbox" name="contact--address-visible" checked> Отображать
                        </label>
                    </div>
                    <div class="form__footer">
                        <button type="submit" class="btn">Применить</button>
                    </div>
                </form>
            </div>
            <div class="workspace__result">
                <div class="b-card">
                    <div class="b-card__organization"></div>
                    <div class="b-card__fio"></div>
                    <div class="b-card__position"></div>
                    <div class="b-card__contact b-card__contact--phone"></div>
                    <div class="b-card__contact b-card__contact--phone2"></div>
                    <div class="b-card__contact b-card__contact--email"></div>
                    <div class="b-card__contact b-card__contact--address"></div>
                </div>
            </div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
